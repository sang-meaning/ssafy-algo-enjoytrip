<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnjoyTrip - 여행 경로 만들기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">EnjoyTrip</a>
    <nav>
      <a href="index.html">관광지 탐색</a>
      <a href="plan.html" class="active">여행 경로 만들기</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="tabs">
        <button data-tab="build" class="on">경로 만들기</button>
        <button data-tab="random">랜덤 경로</button>
        <button data-tab="saved">저장된 경로</button>
      </div>

      <div class="side-scroll">
        <!-- 공통: 관광지 추가 -->
        <div id="addArea">
          <div class="search-box">
            <input id="searchInput" type="text" placeholder="관광지를 검색해서 추가 (초성 가능)" autocomplete="off">
          </div>
          <div id="typeChips" class="chips"></div>
          <div class="section-title">
            <span id="pickedTitle">선택한 관광지</span>
            <button class="btn small" id="clearPicked">모두 비우기</button>
          </div>
          <ul id="picked" class="list picked"></ul>
        </div>

        <!-- 탭 1: 직접 만들기 -->
        <section data-panel="build">
          <div class="options">
            <label for="startSelect">출발지</label>
            <select id="startSelect"></select>
            <label for="endSelect">도착지</label>
            <select id="endSelect"></select>
            <span></span>
            <label><input type="checkbox" id="returnCheck"> 출발지로 돌아오기</label>
          </div>
          <button class="btn primary block" id="optimizeBtn">여행 경로 생성</button>
        </section>

        <!-- 탭 2: 랜덤 경로 -->
        <section data-panel="random" hidden>
          <p class="muted" style="line-height:1.6; margin-top:14px">
            선택한 관광지 중 <b>첫 번째 곳</b>을 기준으로 반경 5km 안에서 관광지를 무작위로 골라
            경로를 만들어 줍니다. 여행 계획이 귀찮을 때 써 보세요.
          </p>
          <div class="options">
            <label for="randomCount">총 개수</label>
            <input type="number" id="randomCount" min="2" max="15" value="5">
            <span>종류</span>
            <div class="checks" id="randomTypes"></div>
          </div>
          <button class="btn primary block" id="randomBtn">랜덤 경로 만들기</button>
        </section>

        <!-- 탭 3: 저장된 경로 -->
        <section data-panel="saved" hidden>
          <div class="section-title">저장된 경로</div>
          <ul id="savedList" class="list"></ul>
        </section>

        <div id="message"></div>
        <div id="result"></div>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div id="mapStatus" class="map-status" hidden></div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/plan.js"></script>
</body>
</html>
